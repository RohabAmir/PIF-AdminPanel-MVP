name: Deploy

# Production deploys only after CI succeeds on main; PRs get Vercel preview deployments.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend → Render
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered."
      - name: Wait for /api/health (max 5 min)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Give Render time to start the new build before polling.
          sleep 60
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/health" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::API did not become healthy within 5 minutes"; exit 1

  frontend:
    name: Frontend → Vercel (production)
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Post-deploy smoke check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -fsS "$APP_URL/login" -o /dev/null && echo "Frontend OK"
          curl -fsS "$APP_URL/api/health" && echo " API via Vercel proxy OK"

  preview:
    name: Frontend → Vercel (PR preview)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview deployment: ${{ steps.deploy.outputs.url }}`,
            });
