name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend — lint, typecheck, unit, e2e, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pif
          POSTGRES_PASSWORD: pif
          POSTGRES_DB: pif_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pif -d pif_admin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Test environment
        run: |
          cp .env.test.example .env.test
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-access-secret-$(openssl rand -hex 24)/" .env.test
          sed -i "s/^JWT_OTP_SECRET=.*/JWT_OTP_SECRET=ci-otp-secret-$(openssl rand -hex 24)/" .env.test
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Prisma generate + migrate deploy
        run: npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pif:pif@localhost:5432/pif_admin_test?schema=public
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend — lint, typecheck, vitest, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pif
          POSTGRES_PASSWORD: pif
          POSTGRES_DB: pif_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pif -d pif_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://pif:pif@localhost:5432/pif_admin?schema=public
      BCRYPT_ROUNDS: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install
        run: npm ci && npm --prefix backend ci && npm --prefix frontend ci
      - name: Configure API
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-access-secret-$(openssl rand -hex 24)/" .env
          sed -i "s/^JWT_OTP_SECRET=.*/JWT_OTP_SECRET=ci-otp-secret-$(openssl rand -hex 24)/" .env
          sed -i "s/^BCRYPT_ROUNDS=.*/BCRYPT_ROUNDS=10/; s/^LOG_LEVEL=.*/LOG_LEVEL=warn/; s/^AUTH_RATE_LIMIT=.*/AUTH_RATE_LIMIT=100/" .env
      - name: Migrate, seed, build
        run: |
          npm --prefix backend run db:migrate
          npm --prefix backend run db:seed
          npm --prefix backend run build
          npm --prefix frontend run build
      - name: Start API + frontend preview
        run: |
          (cd backend && node dist/main > ../api.log 2>&1 &)
          (cd frontend && npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000/api/health http://localhost:5173/login
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173
          MAILPIT_URL: http://localhost:8025
      - name: Upload Playwright report & logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            api.log
            web.log
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit (fails on high/critical)
        run: |
          (cd backend && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm audit --omit=dev --audit-level=high)
      - name: Moderate advisories (warning only)
        continue-on-error: true
        run: |
          (cd backend && npm audit --omit=dev --audit-level=moderate) || echo "::warning::Moderate advisories in backend"
          (cd frontend && npm audit --omit=dev --audit-level=moderate) || echo "::warning::Moderate advisories in frontend"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
